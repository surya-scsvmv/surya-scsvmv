<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
  <title id="title">Penumarthi Phanindra Surya Prabhas — animated terminal profile</title>
  <desc id="desc">Monochrome animated terminal showing profile details, commands, technologies, repositories, and contact links.</desc>
  <defs>
    <style>
      .bg{fill:#050505}.panel{fill:#0b0b0b;stroke:#555;stroke-width:1}.line{stroke:#333;stroke-width:1}
      .white{fill:#f5f5f5}.silver{fill:#bdbdbd}.muted{fill:#777}.dim{fill:#555}
      text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;font-size:15px}
      .small{font-size:12px}.tiny{font-size:11px}.bold{font-weight:700}.command{fill:#fff}
      .cursor{animation:blink 1s steps(2,start) infinite}.scan{animation:scan 7s linear infinite;opacity:.18}
      .boot{animation:fadein .7s ease-out both}.d1{animation-delay:.3s}.d2{animation-delay:.7s}.d3{animation-delay:1.1s}.d4{animation-delay:1.5s}.d5{animation-delay:1.9s}
      .typing{animation:typein 1.5s steps(24,end) both;white-space:nowrap;overflow:hidden}
      @keyframes blink{to{visibility:hidden}} @keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
      @keyframes scan{from{transform:translateY(-10px)}to{transform:translateY(740px)}}
      @keyframes typein{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
      @media (prefers-reduced-motion:reduce){.cursor,.scan,.boot,.typing{animation:none}}
    </style>
    <clipPath id="screen"><rect x="1" y="1" width="958" height="758" rx="12"/></clipPath>
  </defs>
