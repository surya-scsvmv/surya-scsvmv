<svg xmlns="http://www.w3.org/2000/svg" width="840" height="516" viewBox="0 0 840 516" role="img" aria-labelledby="title desc">
<title id="title">Surya Prabhas — GitHub terminal</title>
<desc id="desc">A Dracula-themed terminal showing whoami, neofetch-style profile details, repositories, and uptime, with sequential typing animation.</desc>
<defs>
<style>
.bg{fill:#282a36}.red{fill:#ff5f58}.yellow{fill:#ffbd2e}.green{fill:#18c132}
text{font-family:Monaco,Consolas,Menlo,'Bitstream Vera Sans Mono',monospace;font-size:14px}
.prompt{fill:#ff79c6}.white{fill:#f8f8f2}.cyan{fill:#8be9fd}.lime{fill:#50fa7b}.gold{fill:#f1fa8c}.muted{fill:#bd93f9}
.type{clip-path:inset(0 100% 0 0);animation:typing var(--d,1s) steps(var(--n,20),end) var(--delay,0s) forwards}
@keyframes typing{to{clip-path:inset(0 0 0 0)}}
@media(prefers-reduced-motion:reduce){.type{clip-path:none;animation:none}}
</style>
</defs>
<rect width="840" height="516" rx="7" class="bg"/>
<circle cx="20" cy="20" r="6" class="red"/><circle cx="40" cy="20" r="6" class="yellow"/><circle cx="60" cy="20" r="6" class="green"/>
<text x="420" y="25" text-anchor="middle" font-size="12" class="muted">surya@github: ~</text>
<g transform="translate(20 57)">
  <text x="0" y="0" class="prompt">surya@github.com</text><text x="166" y="0" class="white">:</text><text x="176" y="0" class="cyan">~</text><text x="188" y="0" class="lime">$</text><text x="205" y="0" class="white type" style="--n:6;--d:.4s;--delay:.2s">whoami</text>
  <text x="0" y="25" class="white type" style="--n:35;--d:1.2s;--delay:.8s">Penumarthi Phanindra Surya Prabhas</text>
  <text x="0" y="62" class="prompt">surya@github.com</text><text x="166" y="62" class="white">:</text><text x="176" y="62" class="cyan">~</text><text x="188" y="62" class="lime">$</text><text x="205" y="62" class="white type" style="--n:8;--d:.5s;--delay:2.2s">neofetch</text>
  <g transform="translate(0 91)">
    <g class="lime" font-size="13">
      <text x="0" y="0">██████████████</text>
      <text x="0" y="16">██████████████████</text>
      <text x="0" y="32">██████</text>
      <text x="0" y="48">██████████</text>
      <text x="0" y="64">██████████████</text>
      <text x="0" y="80">████</text>
      <text x="0" y="96">████████████</text>
      <text x="0" y="112">████████</text>
      <text x="0" y="128">██████████████</text>
      <text x="0" y="144">██████</text>
    </g>
    <g transform="translate(250 0)">
      <text x="0" y="0" class="gold type" style="--n:15;--d:.6s;--delay:3s">surya@github</text><text x="112" y="0" class="white">@github.com</text>
      <text x="0" y="23" class="gold">------------------------------</text>
      <text x="0" y="46" class="gold">Name:</text><text x="68" y="46" class="white type" style="--n:35;--d:1.1s;--delay:3.7s">Surya Prabhas</text>
      <text x="0" y="69" class="gold">Education:</text><text x="95" y="69" class="white">B.Tech CSE (AI &amp; DS)</text>
      <text x="0" y="92" class="gold">University:</text><text x="95" y="92" class="white">SCSVMV · 2024–2028</text>
      <text x="0" y="115" class="gold">Languages:</text><text x="95" y="115" class="white">C, C++, Java, Python, R, SQL</text>
      <text x="0" y="138" class="gold">Web/Tools:</text><text x="95" y="138" class="white">HTML, CSS, JS, Git, GitHub</text>
      <text x="0" y="161" class="gold">Repos:</text><text x="68" y="161" class="white">DSA · CPP · DAA · JAVA · DBMS · R</text>
      <text x="0" y="184" class="gold">Focus:</text><text x="68" y="184" class="white">Algorithms, databases, AI, games</text>
      <text x="0" y="207" class="gold">GitHub:</text><text x="68" y="207" class="cyan">github.com/suryaprabhaz</text>
      <text x="0" y="230" class="gold">Instagram:</text><text x="95" y="230" class="cyan">instagram.com/suryaprabhaz</text>
    </g>
  </g>
  <text x="0" y="365" class="prompt">surya@github.com</text><text x="166" y="365" class="white">:</text><text x="176" y="365" class="cyan">~</text><text x="188" y="365" class="lime">$</text><text x="205" y="365" class="white type" style="--n:6;--d:.4s;--delay:5s">uptime</text>
  <text x="0" y="390" class="white type" style="--n:41;--d:1.2s;--delay:5.6s">B.Tech student · learning, building, improving</text>
  <text x="0" y="425" class="prompt">surya@github.com</text><text x="166" y="425" class="white">:</text><text x="176" y="425" class="cyan">~</text><text x="188" y="425" class="lime">$</text><text x="205" y="425" class="white type" style="--n:4;--d:.3s;--delay:7s">exit</text>
  <text x="0" y="453" class="muted" font-size="11">PROFILE SESSION · LEARN / BUILD / IMPROVE</text>
</g>
</svg>