<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc">
<title id="title">Surya Prabhas — terminal profile</title>
<desc id="desc">A clean, realistic terminal profile. Commands and their output are typed character by character, with no other animation.</desc>
<defs><style>
.bg{fill:#080808}.bar{fill:#141414;stroke:#393939}.rule{stroke:#333;stroke-width:1}
text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;font-size:15px}
.muted{fill:#858585}.prompt{fill:#bdbdbd}.cmd{fill:#f5f5f5}.out{fill:#dedede}.dim{fill:#686868}.small{font-size:12px}.tiny{font-size:11px}.bold{font-weight:700}
.type{clip-path:inset(0 100% 0 0);animation:typing var(--duration,1s) steps(var(--chars,12),end) var(--delay,0s) forwards}
@keyframes typing{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@media(prefers-reduced-motion:reduce){.type{clip-path:none;animation:none}}
</style></defs>
